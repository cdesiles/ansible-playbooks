---
- name: Check if yay is already installed
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: yay

- name: Install yay
  when: not yay.stat.exists
  block:
    - name: Install build dependencies
      ansible.builtin.package:
        name:
          - base-devel
          - git
        state: present

    - name: Clean up stale yay sources dir
      ansible.builtin.file:
        path: "{{ yay_src_path }}"
        state: absent

    - name: Create yay sources dir
      ansible.builtin.file:
        path: "{{ yay_src_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Clone git sources
      become: true
      become_user: "{{ ansible_user }}"
      ansible.builtin.git:
        repo: "{{ yay_git_repo }}"
        dest: "{{ yay_src_path }}"
        version: master

    # makepkg refuses to run as root and shells out to sudo to install the
    # built package, so `--noconfirm` needs a passwordless sudo window.
    # Keep that window as small as possible and always close it: the restore
    # lives in `always` so it runs even when the build fails, which otherwise
    # leaves the host with passwordless root for the whole wheel group.
    - name: Build and install yay
      block:
        - name: Disable sudo password prompt (makepkg sudoers hack)
          ansible.builtin.lineinfile:
            dest: /etc/sudoers
            state: present
            regexp: "^#?%wheel"
            line: "%wheel ALL=(ALL) NOPASSWD: ALL"
            validate: /usr/sbin/visudo -cf %s

        - name: Build and install
          become: true
          become_user: "{{ ansible_user }}"
          ansible.builtin.command:
            chdir: "{{ yay_src_path }}"
            cmd: "makepkg -si -f --noconfirm"
          changed_when: true
      always:
        - name: Restore sudo with password prompt
          ansible.builtin.lineinfile:
            dest: /etc/sudoers
            state: present
            regexp: "^#?%wheel"
            line: "%wheel ALL=(ALL:ALL) ALL"
            validate: /usr/sbin/visudo -cf %s
