---
# Included per job with `job` set to the job dict.

- name: Deploy job definition for {{ job.name }}
  ansible.builtin.template:
    src: job.conf.j2
    dest: "{{ backup_config_dir }}/jobs/{{ job.name }}.conf"
    owner: root
    group: root
    mode: "0600"

- name: Create timer override directory for {{ job.name }}
  ansible.builtin.file:
    path: "/etc/systemd/system/backup@{{ job.name }}.timer.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: job.schedule is defined

- name: Deploy schedule override for {{ job.name }}
  ansible.builtin.template:
    src: timer-schedule-override.conf.j2
    dest: "/etc/systemd/system/backup@{{ job.name }}.timer.d/schedule.conf"
    owner: root
    group: root
    mode: "0644"
  when: job.schedule is defined
  notify: Reload systemd

- name: Remove stale schedule override for {{ job.name }}
  ansible.builtin.file:
    path: "/etc/systemd/system/backup@{{ job.name }}.timer.d"
    state: absent
  when: job.schedule is not defined
  notify: Reload systemd
