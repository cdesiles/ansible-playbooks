---
# Arch Linux uses Valkey (Redis fork) since 2024
valkey_package: valkey
valkey_service_name: valkey
valkey_config_file: /etc/valkey/valkey.conf
valkey_user: valkey
valkey_group: valkey
valkey_dir: /var/lib/valkey

# Prometheus exporter
valkey_exporter_package: prometheus-redis-exporter
valkey_exporter_service: prometheus-redis-exporter
valkey_exporter_args_file: /etc/conf.d/prometheus-redis-exporter
valkey_exporter_args_var: REDIS_EXPORTER_ARGS
