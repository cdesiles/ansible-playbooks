apiVersion: 1

# Managed by Ansible (roles/grafana). Notification policy tree.
# NOTE: provisioning replaces the entire tree; UI edits are overwritten on deploy.
policies:
  - orgId: 1
    receiver: ntfy-sys-alerts
    group_by:
      - alertname
      - instance
      - device
      - pool
      - mountpoint
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
