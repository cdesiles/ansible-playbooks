          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{job="node", fstype=~"ext4|xfs|btrfs"}
                / node_filesystem_size_bytes{job="node", fstype=~"ext4|xfs|btrfs"}) >= 80
