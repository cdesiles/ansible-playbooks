      # --- Capacity: local filesystems (system disk, db disk) ---
      # node_exporter's filesystem collector. fstype filter excludes ZFS
      # (pool-wide free space is not per-dataset) and virtual filesystems.
      # Cumulative thresholds; below threshold = no series = NoData, OK.
      - uid: fs_capacity_ge_80
        title: "Filesystem ≥80% full"
        condition: C
