apiVersion: 1

# Managed by Ansible (roles/grafana). Disk alert rules: HDD temperature and
# capacity (ZFS pools + local filesystems).
#
# Temperature metric: smartctl_device_temperature{temperature_type="current"} (job="smartctl").
# Split by device class: HDDs (sd*) and NVMe (nvme*) have different
# safe ranges, so they get separate tier ladders.
#   HDD:  48..60°C (below 45 ideal) — device!~"(/dev/)?nvme.*"
#   NVMe: 65..75°C (40-60 normal, 60-70 warm, >70 throttling) — device=~"(/dev/)?nvme.*"
# Capacity metrics: zfs_pool_capacity_percent and
# node_filesystem_avail_bytes/node_filesystem_size_bytes (job="node").
# node_filesystem_* is filtered to real local filesystems (ext4/xfs/btrfs);
# ZFS datasets are excluded because they report pool-wide free space, not
# per-dataset, and are covered by zfs_pool_capacity_percent instead.
#
# Tiers are cumulative thresholds (>= N), not non-overlapping bands:
#   rising  -> each newly crossed threshold fires; lower tiers keep firing
#   falling -> each crossed-down threshold resolves (ack); lower tiers keep firing
# So a rise pages once per tier crossed and a fall acks once per tier, with the
# final ack when leaving the lowest tier. Below the lowest threshold = no series
# = NoData, mapped to OK on purpose.
groups:
  - orgId: 1
    name: disk-temperature
    folder: Disks
    interval: 1m
    rules:
      - uid: disk_temp_ge_48
        title: "Disk temperature ≥48°C"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                smartctl_device_temperature{job="smartctl", temperature_type="current", device!~"(/dev/)?nvme.*"} >= 48
              instant: false
              intervalMs: 1000
              legendFormat: "{{device}}"
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              refId: B
              type: reduce
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.device }} at {{ $values.B }}°C ({{ $labels.instance }})"
          description: "S.M.A.R.T. temperature is at or above 48°C. Ideal is 20-45°C."

