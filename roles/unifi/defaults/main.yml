---
# UniFi Controller version to deploy
unifi_version: "latest"

# Container image
unifi_image: docker.io/jacobalberty/unifi

# Storage location for persistent data (MongoDB, config, backups)
unifi_data_dir: "{{ podman_projects_dir }}/unifi/data"

# Backup manifest - MongoDB (device/AP config), settings and auto-backups.
unifi_backup_paths:
  - "{{ unifi_data_dir }}"

# Network binding — REQUIRED, must be set in inventory
# IP address of the LAN interface for AP communication (inform, STUN, discovery).
# APs must be able to reach this address.
# unifi_bind_address: ""

# Firewall — sources allowed to reach UniFi ports
unifi_firewall_allowed_sources:
  - 192.168.0.0/16

# Timezone
unifi_timezone: UTC

# JVM configuration
unifi_jvm_max_heap_size: 1024M

# Nginx reverse proxy configuration
unifi_nginx_enabled: false
unifi_nginx_hostname: unifi.nas.local
# Let's Encrypt (certbot) requires a publicly-resolvable hostname. Internal
# names (e.g. *.nas.local) cannot get a public cert: leave this false to use
# the shared self-signed cert (nginx_default_ssl_cert). Set true once a public
# DNS record points at the host.
unifi_nginx_letsencrypt: false
unifi_nginx_ssl_certificate: >-
  {{ unifi_nginx_letsencrypt | ternary(
     '/etc/letsencrypt/live/' ~ unifi_nginx_hostname ~ '/fullchain.pem',
     nginx_default_ssl_cert) }}
unifi_nginx_ssl_certificate_key: >-
  {{ unifi_nginx_letsencrypt | ternary(
     '/etc/letsencrypt/live/' ~ unifi_nginx_hostname ~ '/privkey.pem',
     nginx_default_ssl_key) }}
