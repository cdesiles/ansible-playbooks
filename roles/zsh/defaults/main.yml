---
zsh_os_darwin: "{{ ansible_facts['os_family'] == 'Darwin' }}"
zsh_home: >-
  {{ ansible_facts['env']['HOME'] if (zsh_os_darwin | bool)
     else ('/root' if zsh_user == 'root' else '/home/' + zsh_user) }}
# Primary group of the managed files. macOS has no per-user group (it's `staff`).
zsh_group: >-
  {{ 'staff' if (zsh_os_darwin | bool) else zsh_user }}
zsh_base_config: "{{ zsh_home }}/.zshrc"
zsh_config_path: "{{ zsh_home }}/.config/zsh"
zsh_config_file: "{{ zsh_config_path }}/.zshrc"
zsh_p10k_theme_config: "{{ zsh_config_path }}/p10k.zsh"
zsh_users:
  - jokester
  - root
# tic(1) compiles the alacritty terminfo entry. Arch ships it in `ncurses`,
# Debian/Ubuntu in `ncurses-bin` (there is no `ncurses` package there).
zsh_ncurses_package: >-
  {{ (ansible_facts['os_family'] == 'Archlinux') | ternary('ncurses', 'ncurses-bin') }}
# System-wide on Linux (root:users); per-user on macOS (user:staff).
zsh_plugins_path: >-
  {{ (zsh_config_path + '/plugins') if (zsh_os_darwin | bool) else '/opt/zsh/plugins' }}
zsh_plugins_owner: >-
  {{ ansible_user if (zsh_os_darwin | bool) else 'root' }}
zsh_plugins_group: >-
  {{ 'staff' if (zsh_os_darwin | bool) else 'users' }}
# Homebrew prefix on macOS (Apple Silicon /opt/homebrew, Intel /usr/local).
zsh_darwin_brew_prefix: /opt/homebrew
# rustup shim directory (rustc/cargo + `cargo install` binaries). Added to PATH
# from .zshenv so locally built binaries are runnable in every shell.
zsh_cargo_bin: "{{ zsh_home }}/.cargo/bin"
# fzf shell integrations (key-bindings.zsh / completion.zsh). Resolved at render
# time: calling `brew --prefix` from .zshrc fails whenever brew is not on PATH.
zsh_fzf_shell_path: >-
  {{ (zsh_darwin_brew_prefix + '/opt/fzf/shell') if (zsh_os_darwin | bool) else '/usr/share/fzf' }}
