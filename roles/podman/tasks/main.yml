---
- name: Install podman packages
  ansible.builtin.package:
    name:
      - podman
      - podman-compose
      - crun
    state: present

- name: Check if tun module is available
  ansible.builtin.stat:
    path: "/lib/modules/{{ ansible_facts['kernel'] }}/modules.builtin"
  register: kernel_modules

- name: Load tun kernel module for rootless Podman networking
  community.general.modprobe:
    name: tun
    state: present
  when: kernel_modules.stat.exists
  register: tun_loaded
  ignore_errors: true

- name: Ensure tun module loads on boot
  ansible.builtin.copy:
    content: "tun\n"
    dest: /etc/modules-load.d/tun.conf
    owner: root
    group: root
    mode: "0644"

- name: Warn user about reboot requirement for tun module
  ansible.builtin.debug:
    msg: |
      WARNING: tun kernel module could not be loaded (kernel modules not available).
      A REBOOT IS REQUIRED for the tun module to load and enable Pasta networking.
      After reboot, rootless Podman containers will have better network performance.
  when: not kernel_modules.stat.exists or (tun_loaded is defined and tun_loaded is failed)

- name: Ensure newuidmap has setuid file capability
  community.general.capabilities:
    path: /usr/bin/newuidmap
    capability: cap_setuid+ep
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Ensure newgidmap has setgid file capability
  community.general.capabilities:
    path: /usr/bin/newgidmap
    capability: cap_setgid+ep
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Enable Podman service
  ansible.builtin.systemd:
    name: podman.service
    enabled: true

- name: Create projects directory
  ansible.builtin.file:
    path: "{{ podman_projects_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy registries configuration
  ansible.builtin.template:
    src: registries.conf.j2
    dest: /etc/containers/registries.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy Podman containers configuration
  ansible.builtin.template:
    src: containers.conf.j2
    dest: /etc/containers/containers.conf
    owner: root
    group: root
    mode: "0644"

- name: Get podman version and database backend for {{ ansible_user }}
  ansible.builtin.command: "podman info --format '{% raw %}{{.Version.Version}} {{.Host.DatabaseBackend}}{% endraw %}'"
  register: podman_info
  changed_when: false
  check_mode: false # read-only; the assert below needs real output in --check runs
  become: false
  become_user: "{{ ansible_user }}"

# Single-container pods run `kube play --no-pod-prefix` and name their container
# after the pod. BoltDB shares one namespace between pods and containers.
- name: Validate podman supports kube play --no-pod-prefix
  ansible.builtin.assert:
    that:
      - podman_info.stdout.split()[0] is version('5.7.0', '>=')
      - podman_info.stdout.split()[1] == 'sqlite'
    fail_msg: |
      Pod services need podman >= 5.7.0 (kube play --no-pod-prefix) on the SQLite
      database backend (BoltDB rejects a container named like its pod).
      Found: {{ podman_info.stdout }}. Podman 5.8+ migrates BoltDB to SQLite on reboot.
    success_msg: "podman {{ podman_info.stdout }}"
