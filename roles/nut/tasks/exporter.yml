---
# Prometheus NUT exporter (optional, gated by nut_prometheus_exporter_enabled).
# Installs prometheus-nut-exporter (AUR) and points it at the local upsd via
# the unit's EnvironmentFile (/etc/conf.d/prometheus-nut-exporter).

- name: Install prometheus-nut-exporter (AUR via paru)
  when: ansible_facts['os_family'] == 'Archlinux'
  block:
    - name: Check if the NUT exporter is installed
      ansible.builtin.command: pacman -Qi {{ nut_prometheus_exporter_package }}
      register: _nut_prometheus_exporter_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # paru bails with "can't install AUR package as root" when it has to build,
    # so it runs as the deploy user and needs a scoped sudo window for pacman.
    - name: Build and install prometheus-nut-exporter
      when: _nut_prometheus_exporter_installed.rc != 0
      block:
        - name: Open the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: open

        - name: Build and install prometheus-nut-exporter
          become: false
          ansible.builtin.command:
            cmd: "paru -S --noconfirm --needed {{ nut_prometheus_exporter_package }}"
          changed_when: true
      always:
        - name: Close the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: close

- name: Remove legacy exporter systemd override
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ nut_prometheus_exporter_service }}.service.d"
    state: absent
  notify: Reload systemd

- name: Deploy exporter environment file
  ansible.builtin.template:
    src: nut-exporter-env.conf.j2
    dest: "{{ nut_prometheus_exporter_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart NUT exporter

- name: Enable and start exporter
  ansible.builtin.systemd:
    name: "{{ nut_prometheus_exporter_service }}"
    enabled: true
    state: started
    daemon_reload: true
