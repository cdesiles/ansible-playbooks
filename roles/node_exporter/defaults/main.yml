---
# Prometheus node_exporter configuration

# Address the exporter listens on. Keep localhost-only — Prometheus scrapes it
# locally on the same host; no need to expose on the network.
node_exporter_listen_address: "127.0.0.1:9100"

# Directory the textfile collector reads `*.prom` files from. Jobs (e.g. the
# backup role) drop metrics here; node_exporter re-exposes them to Prometheus.
# Must match backup_metrics_dir in roles/backup/defaults/main.yml.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
