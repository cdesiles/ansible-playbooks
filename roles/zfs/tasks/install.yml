---
- name: Assert the host runs a supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Archlinux', 'Debian']
    fail_msg: >-
      The zfs role supports Arch Linux and Debian/Ubuntu only
      (detected {{ ansible_facts['os_family'] }}).
    success_msg: "ZFS OS support validated"

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
    - debian.yml

# ---------------------------------------------------------------------------
# Arch Linux: zfs-dkms/zfs-utils and zrepl live in the AUR, so they are built
# with paru as the unprivileged user.
# ---------------------------------------------------------------------------
- name: Install ZFS on Arch Linux
  when: ansible_facts['os_family'] == 'Archlinux'
  block:
    - name: Check if zfs-dkms is installed
      ansible.builtin.command: pacman -Qi zfs-dkms
      register: zfs_dkms_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # The restore lives in `always` so it runs even when paru fails. Otherwise a
    # failed build leaves the host with an open passwordless sudo window.
    - name: Install ZFS
      when: zfs_dkms_installed.stderr | length > 0
      block:
        - name: Open the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: open

        # Note: I successfully tried zfs-linux-lts and zfs-linux-lts-headers, but
        # the next kernel upgrade failed: cyclic dependency.
        # Using dkms with the lts linux kernel is a better approach IMO.
        - name: Install ZFS
          become: false
          ansible.builtin.command:
            cmd: "paru -S --noconfirm zfs-dkms zfs-utils"
          changed_when: true
      always:
        - name: Close the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: close

    - name: Check if zrepl is installed
      ansible.builtin.command: pacman -Qi zrepl
      register: zrepl_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install zrepl
      when: zrepl_installed.stderr | length > 0
      block:
        - name: Open the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: open

        - name: Install zrepl
          become: false
          ansible.builtin.command:
            cmd: "paru -S --noconfirm zrepl"
          changed_when: true
      always:
        - name: Close the AUR build sudo window
          ansible.builtin.include_role:
            name: aur_build
            tasks_from: close

# ---------------------------------------------------------------------------
# Debian/Ubuntu: zfsutils-linux pulls the matching kernel module (zfs-dkms or
# a prebuilt module). Vendor kernels (appliance NAS OSes) often have no
# matching headers; the module validation below catches that early.
# ---------------------------------------------------------------------------
- name: Install Debian/Ubuntu kernel headers for ZFS DKMS
  when:
    - ansible_facts['os_family'] == 'Debian'
    - zfs_debian_install_headers | bool
  ansible.builtin.package:
    name: "{{ zfs_debian_headers_package }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install ZFS on Debian/Ubuntu
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.package:
    name: "{{ zfs_debian_packages }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Check if /etc/hostid is present
  ansible.builtin.stat:
    path: /etc/hostid
  register: hostid
  changed_when: false

- name: Generate /etc/hostid if not present
  when: not hostid.stat.exists
  ansible.builtin.command: zgenhostid
  args:
    creates: /etc/hostid

# A module already loaded in the running kernel keeps ZFS operational even when
# its module file is gone: upgrading the kernel package removes
# /usr/lib/modules/<old kernel>, and the host keeps running it until reboot.
# That is a pending reboot, not a broken system — but the boot that follows must
# have a build, otherwise ZFS disappears, so that case is still fatal.
- name: Check if the ZFS module is already loaded
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: zfs_loaded
  changed_when: false

- name: Load ZFS kernel module
  when: not zfs_loaded.stat.exists
  ansible.builtin.command: modprobe zfs
  register: zfs_module
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check the running kernel's module tree
  when: zfs_loaded.stat.exists
  ansible.builtin.stat:
    path: "/lib/modules/{{ ansible_facts['kernel'] }}"
  register: zfs_module_tree
  changed_when: false

- name: Find ZFS module builds for the installed kernels
  when:
    - zfs_loaded.stat.exists
    - not zfs_module_tree.stat.exists
  ansible.builtin.find:
    paths: /usr/lib/modules
    patterns: "zfs.ko*"
    recurse: true
  register: zfs_builds

- name: Report the pending kernel upgrade
  when:
    - zfs_loaded.stat.exists
    - not zfs_module_tree.stat.exists
  ansible.builtin.debug:
    msg: >-
      ZFS is loaded and operational, but the running kernel
      ({{ ansible_facts['kernel'] }}) no longer has its module tree: a kernel
      upgrade is pending a reboot. zfs.ko builds found for installed kernels:
      {{ zfs_builds.matched }}.

- name: Assert the next boot will have ZFS
  when:
    - zfs_loaded.stat.exists
    - not zfs_module_tree.stat.exists
  ansible.builtin.assert:
    that:
      - zfs_builds.matched | int > 0
    fail_msg: |
      ZFS is loaded in the running kernel, but no zfs.ko exists under
      /usr/lib/modules: the next boot would come up without ZFS.
      Rebuild the DKMS module for the installed kernel (dkms autoinstall)
      and check `dkms status` before rebooting.
    success_msg: "ZFS module available for the next boot"

- name: Validate the ZFS kernel module is available
  when:
    - not zfs_loaded.stat.exists
    - not ansible_check_mode
  ansible.builtin.assert:
    that:
      - zfs_module.rc == 0
    fail_msg: |
      The ZFS kernel module could not be loaded for the running kernel
      ({{ ansible_facts['kernel'] }}).
      On stock Debian/Ubuntu install zfs-dkms plus the matching
      linux-headers package. On appliance/vendor kernels (e.g. UGOS) install
      the vendor-provided ZFS module or run a kernel for which ZFS is
      available; this role cannot build a module without matching headers.
      Details: {{ zfs_module.stderr | default('no stderr') }}
    success_msg: "ZFS kernel module loaded"

- name: Enable ZFS services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ zfs_services }}"
# Please note /etc/zfs/zpool.cache should not be present on Arch, as it is
# deprecated and we are using zfs-import-scan.service, which relies on blkid.
# Debian keeps using zfs-import-cache.service (see vars/debian.yml).
