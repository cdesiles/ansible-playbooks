---
# Debian/Ubuntu packages installed by the role. zfsutils-linux depends on the
# matching kernel module (zfs-dkms or a prebuilt module); kmod provides
# modprobe/modinfo used by the module validation below.
zfs_debian_packages:
  - zfsutils-linux
  - kmod

# DKMS needs the headers for the *running* kernel. The package name is
# `linux-headers-$(uname -r)` on Debian/Ubuntu. Set
# zfs_debian_install_headers: false on vendor kernels that provide their own
# ZFS module, or override zfs_debian_headers_package.
zfs_debian_install_headers: true
zfs_debian_headers_package: "linux-headers-{{ ansible_facts['kernel'] }}"

# ZFS capacity metrics (Prometheus)
# ---------------------------------
# Exposes pool size/used/free and per-dataset used/quota to Prometheus via
# node_exporter's textfile collector. node_exporter's built-in --collector.zfs
# only exposes ARC, I/O and pool state — not capacity.
zfs_metrics_enabled: true

# Directory node_exporter's textfile collector reads `*.prom` files from.
# Must match node_exporter_textfile_dir in roles/node_exporter/defaults/main.yml.
zfs_metrics_dir: /var/lib/node_exporter/textfile_collector

# Where the collector script is installed.
zfs_metrics_script_path: /usr/local/bin/zfs-metrics.sh

# systemd OnCalendar expression for the collection timer. Hourly is plenty to
# track daily growth; Prometheus keeps 90d of history on andromeda.
zfs_metrics_interval: "hourly"
