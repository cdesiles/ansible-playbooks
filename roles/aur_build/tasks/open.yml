---
# Opens a passwordless sudo window scoped to {{ ansible_user }} + pacman, for
# AUR builds: makepkg/paru/yay must not run as root but shell out to
# `sudo pacman` to install the built package.
#
# Always pair with tasks/close.yml in an `always:` block. `always:` does not run
# on Ctrl-C or a lost connection, so the rule also carries NOTAFTER: sudo skips
# it once aur_build_window_minutes have passed.
- name: Open the scoped AUR build sudo window
  ansible.builtin.copy:
    dest: "{{ aur_build_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ ansible_user }} ALL=(root) NOTAFTER={{ aur_build_not_after }} NOPASSWD: {{ aur_build_pacman_bin }}\n"
    validate: /usr/sbin/visudo -cf %s
  vars:
    # UTC Generalized Time. now() is naive local time, so .timestamp() is the
    # true epoch (now(utc=true) is naive too and would be off by the offset).
    aur_build_not_after: >-
      {{ '%Y%m%d%H%M%SZ' | strftime(second=now().timestamp() + (aur_build_window_minutes | int) * 60, utc=true) }}
