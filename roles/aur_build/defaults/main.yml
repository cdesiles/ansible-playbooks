---
# sudo applies the LAST matching rule (sudoers(5)), so this filename must sort
# after any other drop-in that grants the deploy user ALL — typically
# /etc/sudoers.d/jokester. Hence the zz- prefix.
aur_build_sudoers_file: /etc/sudoers.d/zz-aur-build
aur_build_pacman_bin: /usr/bin/pacman
# Lifetime of the window (sudoers NOTAFTER). close.yml removes the rule; the
# expiry covers runs that never reach it. A build that outlives it fails on the
# sudo prompt: raise this rather than dropping the expiry.
aur_build_window_minutes: 60
