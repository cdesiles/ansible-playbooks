- name: Authorized keys fallback (when home cannot be mounted)
  when: ssh_authorized_keys_fallback_enabled
  block:
    - name: Create the directory
      ansible.builtin.file:
        path: "{{ ssh_authorized_keys_fallback_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Backup authorized_keys out of HOME dir (if unavailable at startup)
      ansible.builtin.copy:
        src: "/home/{{ item }}/.ssh/authorized_keys"
        dest: "{{ ssh_authorized_keys_fallback_dir }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ssh_users.split() }}"

- name: Remove motd on Debian
  ansible.builtin.file:
    path: /etc/motd
    state: absent
  when: ansible_facts['os_family'] == 'Debian'

# Install the configured keys before touching sshd_config: with
# AuthenticationMethods publickey, a missing key is a lockout.
- name: Install authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ ssh_users.split() | product(sshd_authorized_keys) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: sshd_authorized_keys | length > 0

- name: Resolve SSH users' home directories
  ansible.builtin.getent:
    database: passwd
  when: sshd_authorized_keys | length > 0

- name: Verify each SSH user has an authorized key before hardening
  ansible.builtin.assert:
    that:
      - (ansible_facts['getent_passwd'][item][4] ~ '/.ssh/authorized_keys') is file
    fail_msg: >-
      {{ item }} has no ~/.ssh/authorized_keys. Refusing to apply
      AuthenticationMethods publickey, it would lock the account out.
    quiet: true
  loop: "{{ ssh_users.split() }}"
  when: sshd_authorized_keys | length > 0

- name: Hardening sshd_config
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: "{{ sshd_config }}"
    owner: root
    group: root
    mode: "0600"
    validate: "{{ sshd_binary }} -t -f %s"
  notify: Restart SSH service

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: sshd_ufw_enabled | bool

- name: Enable UFW service at startup
  ansible.builtin.systemd:
    name: ufw
    enabled: true
    state: started
  when: sshd_ufw_enabled | bool
