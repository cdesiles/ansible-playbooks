---
# Partition table management.
#
# DESTRUCTIVE by nature: applying a layout rewrites every partition entry of the
# disk, which destroys the filesystems on it (including / and /home). A missing
# or stale layout file therefore must never trigger a repartition on a live
# host, so applying is opt-in via `disk_partitioning_apply` (default: false).
#
# `layout_file` is resolved relative to the project root (the directory holding
# ansible.cfg), not to the playbook: `lookup('file', ...)` resolves relative to
# the playbook directory, which breaks as soon as a role is included from
# playbooks/<host>.yml. Absolute paths are used as-is.

- name: Install sfdisk
  ansible.builtin.package:
    name: util-linux
    state: present
  changed_when: false

- name: Install hdparm
  ansible.builtin.package:
    name: hdparm
    state: present
  changed_when: false

- name: Resolve the layout file path (controller side)
  ansible.builtin.set_fact:
    disk_layout_path: >-
      {{ item.layout_file if item.layout_file.startswith('/')
         else (ansible_config_file | dirname) ~ '/' ~ item.layout_file }}
  changed_when: false

- name: Load expected layout from file (controller side)
  ansible.builtin.set_fact:
    expected_layout: "{{ lookup('file', disk_layout_path) }}"
  changed_when: false

- name: Get current layout from remote
  ansible.builtin.command: "sfdisk --dump {{ item.device }}"
  register: current_layout
  changed_when: false

- name: Compare expected vs current layout
  vars:
    current_clean: "{{ current_layout.stdout | trim | regex_replace('\\s+', ' ') }}"
    expected_clean: "{{ expected_layout | trim | regex_replace('\\s+', ' ') }}"
  ansible.builtin.set_fact:
    layout_differs: "{{ current_clean != expected_clean }}"
  changed_when: false

- name: Refuse to repartition a live disk without an explicit opt-in
  ansible.builtin.fail:
    msg: |
      The live partition table on {{ item.device }} differs from
      {{ item.layout_file }}.

      Applying the layout would rewrite every partition entry and destroy the
      filesystems on the disk. Nothing was changed.

      To inspect the difference:
        sfdisk --dump {{ item.device }}

      Then either update the layout file to match the live disk, or, if this
      really is a fresh disk to partition, set disk_partitioning_apply: true
      for this host and re-run.
  when:
    - layout_differs
    - not (disk_partitioning_apply | default(false) | bool)

# `command` has no shell, so the layout is fed on stdin rather than with `<`.
- name: Apply partition table using sfdisk
  ansible.builtin.command:
    cmd: "sfdisk {{ item.device }}"
    stdin: "{{ expected_layout }}"
  changed_when: true
  when:
    - layout_differs
    - disk_partitioning_apply | default(false) | bool
