---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd user
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false
  become_user: "{{ ansible_user }}"

- name: Restart ntfy
  ansible.builtin.systemd:
    name: ntfy.service
    state: restarted
    daemon_reload: true # "Reload systemd user" may run after this (play-global handler names)
    scope: user
  become: false
  become_user: "{{ ansible_user }}"

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
